from action_tool.utils import set_outputname: Create Tag on PR Merge

on:
  pull_request:
    branches:
      - main
    types: [ closed ]

permissions:
  id-token: write
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: true

env:
  GITHUB_REPOSITORY: ${{ github.repository }}
  GITHUB_URL: ${{ github.server_url }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  tool_repo: dummyuser/action-toolbox
  tool_branch: main
  CONFIG_TOML_FILE: action_config.toml

jobs:
  eval-release:
    runs-on: ubuntu-latest
    outputs:
      should_make_a_release: ${{ steps.prepare-release.outputs.should_make_release }}
      release_override: ${{ steps.prepare-release.outputs.release_override }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }} # we don't need the PR head sha, we need the base sha to calculate the next version
          fetch-depth: 0

      - name: Checkout Tool
        uses: actions/checkout@v4
        with:
          repository: ${{ env.tool_repo }}
          path: action_tool
          ref: ${{ env.tool_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - run: pip install .
        working-directory: action_tool

      - name: Prepare Release
        shell: python
        id: prepare-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          from action_tool.git_remote_adapter import get_git_remote_adapter
          from action_tool.config import logger
          
          logger.setLevel("INFO")
          
          git_remote = get_git_remote_adapter()
          git_remote.prepare_release()
  
  

  generateRelease:
    needs: eval-release
    if: ${{ needs.eval-release.outputs.should_make_a_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout git
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          ssh-key: ${{ secrets.SOURCE_KEY }}

      - name: Checkout Tool
        uses: actions/checkout@v4
        with:
          repository: ${{ env.tool_repo }}
          path: action_tool
          ref: ${{ env.tool_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - run: pip install .
        working-directory: action_tool

      - name: Check PR for any labels suggesting release_override
        shell: python
        env:
          RELEASE_OVERRIDE: ${{ needs.eval-release.outputs.release_override }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          from action_tool.git_remote_adapter import get_git_remote_adapter
          from action_tool.config import logger
          
          logger.setLevel("INFO")
          
          git_adapter = get_git_remote_adapter()
          git_adapter.make_new_release()
          
