name: Create Tag on PR Merge

on:
  pull_request:
    branches:
      - main
    types: [ closed ]

permissions:
  id-token: write
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: true

env:
  GITHUB_REPOSITORY: ${{ github.repository }}
  GITHUB_URL: ${{ github.server_url }}
  tool_repo: dummyuser/action-toolbox
  tool_branch: main
  config_toml_file: action_config.toml

jobs:
  pr-version-calculate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }} # we don't need the PR head sha, we need the base sha to calculate the next version
          fetch-depth: 0

      - name: Checkout Tool
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.tool_repo }}
          path: action_tool
          ref: ${{ inputs.tool_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - run: pip install .
        working-directory: action_tool

      - name: Run PR version calc
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        shell: python
        run: |
          import os
          import json
          from action_tool.pr_version_calc import add_commit_for_semantic_release_calculation, get_latest_release_tag, \
            check_calculated_version
          
          repo_path = ""
          add_commit_for_semantic_release_calculation(repo_path, os.getenv('PR_TITLE'))
          latest_tag = get_latest_release_tag(repo_path)
          check_calculated_version(labels, os.getenv('config_toml_file'), latest_tag)

  generateRelease:
    needs: pr-version-calculate
    if: ${{ needs.pr-version-calculate.outputs.is_release == 'true' || inputs.release_override != '' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout git
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{github.ref_name}}
          ssh-key: ${{ secrets.SOURCE_KEY }}

      - name: Check PR for any labels suggesting release_override
        if: ${{ inputs.release_override == '' }}
        shell: python
        run: |
          import os
          
          def set_env(name, value):
            with open(os.environ['GITHUB_ENV'], 'a') as fh:
                print(f'{name}={value}', file=fh)
          
          release_override_found = "${{ needs.pr-version-calculate.outputs.release_override_found }}"
          if release_override_found != '':
            set_env('RELEASE_OVERRIDE', release_override_found)  
          

      - name: Set up Python ${{ inputs.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-semantic-release=="${{ inputs.python_semantic_release_pkg }}"

      - name: Run semantic release force ${{ env.RELEASE_OVERRIDE }}
        run: |
          semantic-release --config ${{ inputs.config_toml_file }} version --changelog ${{ env.RELEASE_OVERRIDE }} --vcs-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

