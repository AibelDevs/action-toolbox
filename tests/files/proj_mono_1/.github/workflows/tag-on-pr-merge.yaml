from action_tool.utils import set_outputname: Create Tag on PR Merge

on:
  pull_request:
    branches:
      - main
    types: [ closed ]

permissions:
  id-token: write
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: true

env:
  GITHUB_REPOSITORY: ${{ github.repository }}
  GITHUB_URL: ${{ github.server_url }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  tool_repo: dummyuser/action-toolbox
  tool_branch: main
  CONFIG_TOML_FILE: action_config.toml

jobs:
  eval-release:
    runs-on: ubuntu-latest
    outputs:
      should_make_a_release: ${{ steps.evaluate-release.outputs.should_make_release }}
      release_label: ${{ steps.evaluate-release.outputs.release_label }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }} # we don't need the PR head sha, we need the base sha to calculate the next version
          fetch-depth: 0

      - name: Checkout Tool
        uses: actions/checkout@v4
        with:
          repository: ${{ env.tool_repo }}
          path: action_tool
          ref: ${{ env.tool_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - run: pip install .
        working-directory: action_tool

      - name: Evaluate Release
        shell: python
        id: evaluate-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          from action_tool.git_remote_adapter import get_git_remote_adapter
          from action_tool.utils import set_output
          
          git_remote = get_git_remote_adapter()
          if git_remote.should_release():
              set_output("should_make_release", "true")
              rel_label = git_remote.get_pr_release_label()
              set_output("release_label", rel_label)
          else:
              set_output("should_make_release", "false")
  

  generateRelease:
    needs: eval-release
    if: ${{ needs.eval-release.outputs.should_make_a_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout git
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          ssh-key: ${{ secrets.SOURCE_KEY }}

      - name: Checkout Tool
        uses: actions/checkout@v4
        with:
          repository: ${{ env.tool_repo }}
          path: action_tool
          ref: ${{ env.tool_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - run: pip install .
        working-directory: action_tool

      - name: Check PR for any labels suggesting release_override
        shell: python
        env:
          RELEASE_LABEL: ${{ needs.eval-release.outputs.release_label }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import os
          from action_tool.pr_version_calc import calculate_version
          
          rel_label = os.getenv("RELEASE_LABEL")
          config_toml_file = os.getenv("CONFIG_TOML_FILE")
          
          calculate_version(rel_label, config_toml_file) 
