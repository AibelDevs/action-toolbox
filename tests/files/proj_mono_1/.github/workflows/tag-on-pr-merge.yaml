name: Create Tag on PR Merge

on:
  pull_request:
    branches:
      - main
    types: [ closed ]

permissions:
  id-token: write
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: true

env:

  GITHUB_REPOSITORY: ${{ github.repository }}
  GITHUB_URL: ${{ github.server_url }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  tool_repo: dummyuser/action-toolbox
  tool_branch: main
  CONFIG_TOML_FILE: action_config.toml
  SRC_MAIN_BRANCH_DIR: ${{ github.workspace }}/__source_main
  TOOL_PATH_DIR: ${{ github.workspace }}/__action_tool

jobs:
  eval-release:
    runs-on: ubuntu-latest
    outputs:
      should_make_a_release: ${{ steps.prepare-release.outputs.should_make_release }}
      release_override: ${{ steps.prepare-release.outputs.release_override }}
      release_mono_label: ${{ steps.prepare-release.outputs.release_mono_label }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }} # we don't need the PR head sha, we need the base sha to calculate the next version
          fetch-depth: 0
          path: ${{ env.SRC_MAIN_BRANCH_DIR }}

      - name: Checkout Tool
        uses: actions/checkout@v4
        with:
          repository: ${{ env.tool_repo }}
          ref: ${{ env.tool_branch }}
          fetch-depth: 0
          path: ${{ env.TOOL_PATH_DIR }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - run: pip install .
        working-directory: ${{ env.TOOL_PATH_DIR }}

      - name: Prepare Release
        shell: python
        id: prepare-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          from action_tool.git_remote_adapter import get_git_remote_adapter
          from action_tool.config import logger
          
          logger.setLevel("INFO")
          
          git_remote = get_git_remote_adapter()
          git_remote.prepare_release()
        working-directory: ${{ env.SRC_MAIN_BRANCH_DIR }}
  

  create-release:
    needs: eval-release
    if: ${{ needs.eval-release.outputs.should_make_a_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout git
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          #ref: ${{ github.ref_name }}
#          ref: ${{ github.event.ref }}  # This is more explicit
          ref: ${{ github.base_ref }}  # This refers to the PR base branch, usually 'main'
          #ssh-key: ${{ secrets.SOURCE_KEY }}
          path: ${{ env.SRC_MAIN_BRANCH_DIR }}

      - name: Checkout Tool
        uses: actions/checkout@v4
        with:
          repository: ${{ env.tool_repo }}
          ref: ${{ env.tool_branch }}
          fetch-depth: 0
          path: ${{ env.TOOL_PATH_DIR }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - run: pip install .
        working-directory: ${{ env.TOOL_PATH_DIR }}

      - name: Check PR for any labels suggesting release_override
        shell: python
        env:
          RELEASE_OVERRIDE: ${{ needs.eval-release.outputs.release_override }}
          RELEASE_MONO_LABEL: ${{ needs.eval-release.outputs.release_mono_label }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          from action_tool.git_remote_adapter import get_git_remote_adapter
          from action_tool.config import logger
          
          logger.setLevel("INFO")
          
          git_adapter = get_git_remote_adapter()
          git_adapter.make_new_release()
        working-directory: ${{ env.SRC_MAIN_BRANCH_DIR }}
