name: tool-generate-semantic-version
on:
  workflow_call:
    inputs:
      python_version:
        description: "Python version"
        type: string
        required: false
        default: "3.11"
      config_toml_file:
        description: "config file in repo for actions"
        type: string
        required: false
        default: "action_config.toml"
      python_semantic_release_pkg:
        description: "python-semantic-release pkg to use"
        type: string
        required: false
        default: "8.5.1"
      release_override:
        description: "if set this will override semantic release and labels used"
        type: string
        required: false
        default: ""
      tool_repo:
        description: "Tool repository"
        type: string
        required: true
      tool_branch:
        description: "Tool branch"
        type: string
        required: true
    secrets:
      SOURCE_KEY:
        required: false

permissions:
  id-token: write
  contents: write
  pull-requests: read

env:
  GITHUB_REPOSITORY: ${{ github.repository }}
  GITHUB_URL: ${{ github.server_url }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  tool_repo: ${{ inputs.tool_repo }}
  tool_branch: ${{ inputs.tool_branch }}
  CONFIG_TOML_FILE: ${{ inputs.config_toml_file }}

jobs:
  eval-release:
    runs-on: ubuntu-latest
    outputs:
      should_make_a_release: ${{ steps.evaluate-release.outputs.should_make_release }}
      release_label: ${{ steps.evaluate-release.outputs.release_label }}
      pr_title: ${{ steps.evaluate-release.outputs.pr_title }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }} # we don't need the PR head sha, we need the base sha to calculate the next version
          fetch-depth: 0

      - name: Checkout Tool
        uses: actions/checkout@v4
        with:
          repository: ${{ env.tool_repo }}
          path: action_tool
          ref: ${{ env.tool_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - run: pip install .
        working-directory: action_tool

      - name: Evaluate Release
        shell: python
        id: evaluate-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          from action_tool.git_remote_adapter import get_git_remote_adapter
          from action_tool.config import logger
          
          logger.setLevel("INFO")
          
          git_remote = get_git_remote_adapter()
          git_remote.prepare_release()
  

  generateRelease:
    needs: eval-release
    if: ${{ needs.eval-release.outputs.should_make_a_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout git
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{github.ref_name}}
          ssh-key: ${{ secrets.SOURCE_KEY }}

      - name: Checkout Tool
        uses: actions/checkout@v4
        with:
          repository: ${{ env.tool_repo }}
          path: action_tool
          ref: ${{ env.tool_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - run: pip install .
        working-directory: action_tool

      - name: Check PR for any labels suggesting release_override
        shell: python
        env:
          RELEASE_OVERRIDE: ${{ needs.eval-release.outputs.release_override }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          from action_tool.git_remote_adapter import get_git_remote_adapter
          from action_tool.config import logger
          
          logger.setLevel("INFO")
          
          git_adapter = get_git_remote_adapter()
          git_adapter.make_new_release()
